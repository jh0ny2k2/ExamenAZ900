<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertHub</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.svg" />
    <script src="./theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fbfbfa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CertHub">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11516/11516757.png">
    <link rel="stylesheet" href="./css/site.css">
    <style>
        /* Intro */
        .intro { padding-top: 72px; padding-bottom: 48px; }
        .intro h1 {
            margin: 0 0 16px;
            font-size: clamp(30px, 4.2vw, 44px);
            line-height: 1.12;
            font-weight: 600;
            letter-spacing: -0.03em;
            max-width: 20ch;
        }
        .intro p { margin: 0; max-width: 58ch; font-size: 17px; color: var(--muted); }
        .intro .note { margin-top: 20px; font-size: 14px; color: var(--faint); }

        /* Toolbar */
        .toolbar {
            position: sticky; top: 0; z-index: 10;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .toolbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .search { position: relative; flex-shrink: 0; width: 200px; }
        .search .field { height: 34px; padding-right: 34px; }
        .search input::-webkit-search-cancel-button { display: none; }
        .search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }

        /* Catalog */
        .catalog { padding-top: 16px; padding-bottom: 96px; flex: 1; }
        .group { margin-top: 40px; }
        .group-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--text); }
        .group-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
        .group-head span { font: 12px var(--mono); color: var(--faint); }

        .row {
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
            transition: background .15s, box-shadow .15s;
        }
        /* Hover fill bleeds past the column without moving the divider lines */
        .row:hover { background: var(--hover); box-shadow: -12px 0 0 var(--hover), 12px 0 0 var(--hover); }
        .code { display: flex; align-items: center; gap: 9px; font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
        .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
        .code.guide { color: var(--faint); font-weight: 400; }
        .info { min-width: 0; }
        .info h3 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.005em; }
        .info p { margin: 2px 0 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions { display: flex; align-items: center; gap: 8px; }
        .actions .link { height: 32px; padding: 0 4px 0 6px; font-size: 13.5px; }

        .empty { padding: 72px 0; color: var(--muted); }
        .empty button { margin-top: 8px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

        .skeleton-row { height: 69px; border-bottom: 1px solid var(--line); position: relative; }
        .skeleton-row::before, .skeleton-row::after { content: ""; position: absolute; top: 20px; height: 12px; border-radius: 3px; background: var(--hover); }
        .skeleton-row::before { left: 0; width: 72px; }
        .skeleton-row::after { left: 136px; width: 40%; }

        @media (max-width: 760px) {
            .intro { padding-top: 48px; padding-bottom: 32px; }
            .intro p { font-size: 16px; }
            .toolbar .wrap { flex-direction: column-reverse; align-items: stretch; gap: 0; padding-top: 12px; }
            .search { width: 100%; }
            .search kbd { display: none; }
            .row { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px 0; }
            .row:hover { background: none; box-shadow: none; }
            .info p { white-space: normal; }
            .actions .btn { flex: 1; height: 36px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="wrap">
            <a href="./" class="wordmark"><img src="./favicon.svg" alt="">CertHub</a>
            <nav class="header-nav">
                <a href="./changelog.html" data-i18n="changelog"></a>
                <button id="langToggle" class="lang-switch" aria-label="Idioma / Language">
                    <span data-lang="es">ES</span><span>/</span><span data-lang="en">EN</span>
                </button>
                <button id="themeToggle" class="theme-toggle" aria-label="Tema / Theme">
                    <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
            </nav>
        </div>
    </header>

    <section class="intro wrap">
        <h1 data-i18n="h1"></h1>
        <p id="introText"></p>
        <p class="note" data-i18n="note"></p>
    </section>

    <div class="toolbar">
        <div class="wrap">
            <div id="tabs" class="tabs" role="tablist"></div>
            <label class="search">
                <input type="search" id="searchInput" class="field" autocomplete="off" placeholder=" ">
                <kbd>/</kbd>
            </label>
        </div>
    </div>

    <main class="catalog wrap" id="catalog"></main>

    <footer class="site-footer">
        <div class="wrap">
            <span><span data-i18n="madeBy"></span> <strong>Jhonathan Chaves</strong> · 2026</span>
            <a href="./changelog.html">v1.4.0</a>
        </div>
    </footer>

    <script>
        const I18N = {
            es: {
                title: 'CertHub · Bancos de preguntas para certificaciones cloud',
                changelog: 'Novedades',
                h1: 'Bancos de preguntas para preparar certificaciones cloud.',
                intro: (exams, guides) => `${exams} exámenes y ${guides} guías de estudio. En modo práctica ves la corrección y la explicación después de cada pregunta; en modo examen respondes todo seguido y ves la nota al final.`,
                note: 'Sigo añadiendo contenido. Si echas en falta alguna certificación, avísame.',
                search: 'Buscar',
                all: 'Todo', other: 'Otros',
                practice: 'Práctica', exam: 'Examen', notes: 'Apuntes', official: 'Guía oficial', openGuide: 'Abrir guía',
                guide: 'guía',
                empty: (q) => q ? `No hay nada que coincida con «${q}».` : 'No hay nada en esta categoría.',
                clear: 'Ver todo',
                madeBy: 'Hecho por',
            },
            en: {
                title: 'CertHub · Question banks for cloud certifications',
                changelog: 'Changelog',
                h1: 'Question banks to prepare for cloud certifications.',
                intro: (exams, guides) => `${exams} exams and ${guides} study guides. Practice mode shows the answer and explanation after every question; exam mode runs straight through and grades you at the end.`,
                note: "I'm still adding content. If a certification is missing, let me know.",
                search: 'Search',
                all: 'All', other: 'Other',
                practice: 'Practice', exam: 'Exam', notes: 'Notes', official: 'Official guide', openGuide: 'Open guide',
                guide: 'guide',
                empty: (q) => q ? `Nothing matches “${q}”.` : 'Nothing in this category.',
                clear: 'Show everything',
                madeBy: 'Made by',
            }
        };

        const PROVIDERS = {
            azure:      { label: 'Microsoft Azure', color: '#0078d4' },
            aws:        { label: 'AWS',             color: '#ff9900' },
            google:     { label: 'Google Cloud',    color: '#34a853' },
            kubernetes: { label: 'Kubernetes',      color: '#326ce5' },
            terraform:  { label: 'Terraform',       color: '#7b42bc' },
            git:        { label: 'Git & GitHub',    color: '#f05032' },
            other:      { label: null,              color: '#9d9da3' },
        };

        const ARROW_OUT = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
        const ARROW_RIGHT = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

        let lang = localStorage.getItem('hub_lang') || 'es';
        let activeTab = 'all';
        let items = [];

        const $ = (id) => document.getElementById(id);
        const t = (key) => I18N[lang][key];
        const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const isExternal = (url) => /^https?:\/\//i.test(url || '');
        const searchInput = $('searchInput');

        function getProvider(exam) {
            const text = `${exam.name} ${exam.title || ''}`.toLowerCase();
            if (/kubernetes|kcna/.test(text)) return 'kubernetes';
            if (/terraform|hashicorp/.test(text)) return 'terraform';
            if (/github|\bgit\b|gh-\d/.test(text)) return 'git';
            if (/aws|amazon/.test(text)) return 'aws';
            if (/google|gcp/.test(text)) return 'google';
            if (/azure|microsoft|\b(az|ai|dp)-\d{3}\b/.test(text)) return 'azure';
            return 'other';
        }

        // Entries without a question bank only link to notes
        const isGuide = (exam) => !exam.pregunta;
        const providerLabel = (key) => PROVIDERS[key].label || t('other');

        function getCode(exam) {
            if (exam.code) return exam.code;
            const m = `${exam.name} ${exam.title || ''}`.match(/\b[A-Z]{2,4}-\d{3}\b/);
            if (m) return m[0];
            return /^[A-Z0-9]{3,6}$/.test(exam.name) ? exam.name : '';
        }

        // "AZ-900 • Fundamentos de Azure" -> "Fundamentos de Azure"
        const getHeading = (exam) => (exam.title || exam.name).split(' • ').pop();

        function quizUrl(exam, mode) {
            const url = new URL('./Cuestionario/cuestionario.html', location.href);
            url.searchParams.set('name', exam.name);
            if (exam.title) url.searchParams.set('title', exam.title);
            url.searchParams.set('preguntas', isExternal(exam.pregunta) ? exam.pregunta : `../${exam.pregunta}`);
            if (exam.apuntes) url.searchParams.set('apuntes', isExternal(exam.apuntes) ? exam.apuntes : `../${exam.apuntes}`);
            url.searchParams.set('lang', lang);
            url.searchParams.set('mode', mode);
            return url.href;
        }

        function rowHtml(exam) {
            const key = getProvider(exam);
            const guide = isGuide(exam);
            const ext = isExternal(exam.apuntes);
            const target = ext ? ' target="_blank" rel="noopener"' : '';

            const actions = guide
                ? `<a class="btn" href="${esc(exam.apuntes)}"${target}>${t('openGuide')} ${ARROW_RIGHT}</a>`
                : `${exam.apuntes ? `<a class="link" href="${esc(exam.apuntes)}"${target}>${ext ? t('official') : t('notes')}${ext ? ARROW_OUT : ''}</a>` : ''}
                   <a class="btn" href="${quizUrl(exam, 'practica')}">${t('practice')}</a>
                   <a class="btn btn-primary" href="${quizUrl(exam, 'examen')}">${t('exam')}</a>`;

            return `
                <div class="row" style="--accent:${PROVIDERS[key].color}">
                    <div class="code${guide ? ' guide' : ''}"><span class="dot"></span>${guide ? t('guide') : esc(getCode(exam))}</div>
                    <div class="info">
                        <h3>${esc(getHeading(exam))}</h3>
                        <p title="${esc(exam.desc || '')}">${esc(exam.desc || '')}</p>
                    </div>
                    <div class="actions">${actions}</div>
                </div>`;
        }

        function matches(exam, q) {
            if (!q) return true;
            const haystack = `${exam.name} ${exam.title || ''} ${exam.desc || ''} ${providerLabel(getProvider(exam))}`.toLowerCase();
            return q.split(/\s+/).every(w => haystack.includes(w));
        }

        function renderTabs() {
            const counts = { all: items.length };
            items.forEach(e => { const k = getProvider(e); counts[k] = (counts[k] || 0) + 1; });
            const keys = ['all', ...Object.keys(PROVIDERS).filter(k => counts[k])];

            $('tabs').innerHTML = keys.map(k => `
                <button class="tab" role="tab" data-key="${k}" aria-selected="${k === activeTab}">
                    ${esc(k === 'all' ? t('all') : providerLabel(k))}<span class="n">${counts[k]}</span>
                </button>`).join('');
        }

        function renderCatalog() {
            const q = searchInput.value.trim().toLowerCase();
            const visible = items.filter(e => (activeTab === 'all' || getProvider(e) === activeTab) && matches(e, q));

            if (!visible.length) {
                $('catalog').innerHTML = `<div class="empty">${esc(t('empty')(searchInput.value.trim()))}<br><button id="clearAll">${t('clear')}</button></div>`;
                return;
            }

            // Group by provider, exams before guides inside each group
            const groups = Object.keys(PROVIDERS)
                .map(key => ({ key, list: visible.filter(e => getProvider(e) === key).sort((a, b) => isGuide(a) - isGuide(b)) }))
                .filter(g => g.list.length);

            $('catalog').innerHTML = groups.map(g => `
                <section class="group">
                    <div class="group-head"><h2>${esc(providerLabel(g.key))}</h2><span>${g.list.length}</span></div>
                    ${g.list.map(rowHtml).join('')}
                </section>`).join('');
        }

        function applyLanguage() {
            document.documentElement.lang = lang;
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('#langToggle [data-lang]').forEach(el => el.classList.toggle('on', el.dataset.lang === lang));
            searchInput.placeholder = t('search');
            if (items.length) {
                $('introText').textContent = t('intro')(items.filter(e => !isGuide(e)).length, items.filter(isGuide).length);
                renderTabs();
                renderCatalog();
            }
        }

        $('langToggle').addEventListener('click', () => {
            lang = lang === 'es' ? 'en' : 'es';
            localStorage.setItem('hub_lang', lang);
            applyLanguage();
        });

        $('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme:dark', isDark ? '1' : '0');
        });

        $('tabs').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab');
            if (!tab) return;
            activeTab = tab.dataset.key;
            renderTabs();
            renderCatalog();
        });

        $('catalog').addEventListener('click', (e) => {
            if (e.target.id !== 'clearAll') return;
            searchInput.value = '';
            activeTab = 'all';
            renderTabs();
            renderCatalog();
        });

        searchInput.addEventListener('input', renderCatalog);

        // "/" or Ctrl/⌘+K focuses the search, Escape clears it
        document.addEventListener('keydown', (e) => {
            const typing = /input|textarea|select/i.test(document.activeElement.tagName);
            if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                renderCatalog();
                searchInput.blur();
            }
        });

        (async function init() {
            applyLanguage();
            $('catalog').innerHTML = '<section class="group">' + '<div class="skeleton-row"></div>'.repeat(6) + '</section>';

            try {
                const res = await fetch('./examenes.json', { cache: 'no-store' });
                items = await res.json();
            } catch (e) {
                console.error(e);
                items = [];
            }
            applyLanguage();
        })();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
