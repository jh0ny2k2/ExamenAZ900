      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function inline(s) {
        let html = escapeHtml(s);
        html = html.replace(/`(.*?)`/g, '<code>$1</code>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return html;
      }

      // Minimal line-based Markdown: ## / ### headings, "* " and "1. " lists, paragraphs.
      function parseMarkdown(md) {
        if (!md) return '';
        const out = [];
        let para = [];
        let list = null; // { tag, items }
        const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
        const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.tag}>`); list = null; } };
        md.split('\n').forEach(raw => {
          const line = raw.trim();
          let m;
          if (!line) { flushPara(); flushList(); return; }
          if ((m = line.match(/^### (.*)$/))) { flushPara(); flushList(); out.push('<h5>' + inline(m[1]) + '</h5>'); return; }
          if ((m = line.match(/^## (.*)$/))) { flushPara(); flushList(); out.push('<h4>' + inline(m[1]) + '</h4>'); return; }
          if (/^# /.test(line)) { flushPara(); flushList(); return; }
          if ((m = line.match(/^\*\s+(.*)$/))) {
            flushPara();
            if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
            list.items.push(m[1]); return;
          }
          if ((m = line.match(/^\d+\.\s+(.*)$/))) {
            flushPara();
            if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
            list.items.push(m[1]); return;
          }
          flushList();
          para.push(line);
        });
        flushPara(); flushList();
        return out.join('\n');
      }

## Objetivo del día
Al final de este día debes ser capaz de:
*   Explicar Ka0s en 2–3 minutos como un “organismo” (cerebro, músculo, memoria, sentidos, sistema nervioso).
*   Señalar en el repositorio dónde vive cada parte (rutas concretas).
*   Entender por qué \`audit/\` es central y cómo se usa como “verdad del sistema”.

## Por qué esto importa
Ka0s no es un conjunto de scripts sueltos. Es una plataforma con una idea fuerte:
*   El repositorio es **código + operaciones + seguridad + evidencia**.
*   Si una automatización no deja evidencia, operativamente “no existe”.
*   La modularidad existe para que puedas reutilizar y escalar.

Piensa Ka0s como un organismo:
*   **Cerebro (GitHub Actions)**: decide qué hacer y orquesta el flujo.
*   **Músculo (Kubernetes + scripts)**: ejecuta despliegues y auditorías en el entorno real.
*   **Sentidos (Zabbix / Wazuh / ELK)**: observan disponibilidad, seguridad y logs.
*   **Memoria (iTop + \`audit/\`)**: registra el estado operacional (tickets) y la evidencia de ejecuciones.
*   **Sistema nervioso (n8n)**: conecta señales y acciones.

## Mapa del repositorio
*   **Cerebro**: workflows y actions reutilizables (\`.github/workflows/\`)
*   **Músculo**: scripts operativos y manifests (\`devops/core/k8s/\`)
*   **Sentidos**: definición/operación de observabilidad (\`core/ai/prompt_*.md\`)
*   **Memoria**: iTop y Evidencia (\`audit/\`)
*   **Sistema nervioso**: n8n

## Paso a paso
### Paso 1 — Aprende el vocabulario
*   **Atómicos**: automatismos de una acción, combinables.
*   **Efímeros**: acciones muy cortas.
*   **Inspector**: sistema de auditoría/resultado.
*   **Número Aureo (3)**: conseguir resultado en menos de 3 pasos.

### Paso 2 — Ubica la documentación base
Lee [ka0s.md](core/docs/ka0s/ka0s.md) para entender el Core Orchestrator.

### Paso 3 — Lee la Constitución
Lee [prompt_ka0s.md](core/ai/prompt_ka0s.md):
*   **Evidencia**: todo deja rastro en \`audit/\`.
*   **SSH First**: se opera en el entorno real.
*   **JSON por defecto**: salidas estructuradas.
            `},

Al final de este día debes ser capaz de:
*   Explicar qué activa Ka0s y qué no.
*   Seguir el workflow principal de principio a fin.
*   Identificar qué evidencia se genera y en qué ruta.

## Por qué esto importa
El orquestador es la pieza que transforma un commit en una ejecución auditable.
*   No sabrás por qué un cambio disparó (o no) automatizaciones.
*   No sabrás dónde mirar cuando algo falla.

## Dónde verlo en el repo
*   Workflow principal: \`kaos.yml\`
*   Evidencia típica: \`audit/kaos\`

## Paso a paso
### Paso 1 — Entiende los disparadores (triggers)
Revisa el bloque \`on:\` en \`kaos.yml\`. Define qué eventos (push) y qué rutas activan el pipeline.

### Paso 2 — Entiende permisos y variables
Las variables \`KAOS_*\` son metadatos clave:
*   \`KAOS_CODE\`: run_id
*   \`KAOS_MODULE\`: etiqueta del módulo
*   \`KAOS_PATH_RESUME\`: ruta de evidencia

### Paso 3 — Sigue el job principal
1.  **Checkout**: clona el repo.
2.  **Validación**: verifica extensiones permitidas.
3.  **JSON del evento**: guarda "qué pasó" para auditoría.
4.  **Lista de archivos**: evidencia explícita de cambios.
5.  **Subida de evidencias**: commit/push a \`audit/\`.
6.  **Selección de módulos**: dispatcher que elige el subworkflow.

## Errores típicos
*   **No se ejecuta**: revisa \`on.paths\`.
*   **No hay evidencia**: revisa step de commit/push.

SSH First evita operar sobre entornos simulados. Inspeccionas y actúas sobre el control plane real, reduciendo drift.

*   Workflow reusable: \`ssh-connect.yml\`

1.  **No interactivo**: jamás pedir input.

      const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
      const pad = n => String(n).padStart(2, '0');
      const topics = []; // { it, secIdx, el, details, link }
      const sectionEls = []; // { section, link }

      function build() {
        let total = 0;
        SECTIONS.forEach((sec, secIdx) => {
          const section = document.createElement('section');
          section.className = 'doc-section';
          section.id = sec.id;
          section.innerHTML = `
            <h2><span class="n">${pad(secIdx + 1)}</span>${sec.label}</h2>
            <p class="section-intro">${sec.desc}</p>
          `;

          const secLink = document.createElement('a');
          secLink.href = `#${sec.id}`;
          secLink.innerHTML = `<span class="n">${pad(secIdx + 1)}</span>${sec.label}`;
          els.toc.appendChild(secLink);
          sectionEls.push({ section, link: secLink });

          sec.items.forEach((item, idx) => {
            const it = { ...item, id: `${sec.id}-${idx}` };
            total += 1;

            const link = document.createElement('a');
            link.href = `#note-${it.id}`;
            link.className = 'sub';
            link.textContent = it.t;
            link.addEventListener('click', () => { details.open = true; });
            els.toc.appendChild(link);

            const el = document.createElement('div');
            el.className = 'topic';
            el.id = `note-${it.id}`;
            el.innerHTML = `
              <details class="fold">
                <summary><span class="sum"><span class="t">${it.t}</span><span class="d">${it.d}</span></span></summary>
                <div class="fold-body prose">${parseMarkdown(it.md)}</div>
              </details>
              <label class="read-toggle"><input type="checkbox" data-id="${it.id}"><span class="box">${CHECK_SVG}</span>Estudiado</label>
            `;
            const details = el.querySelector('details');
            const input = el.querySelector('input');
            input.checked = !!studied[it.id];
            input.addEventListener('change', (e) => {
              studied[it.id] = e.target.checked;
              localStorage.setItem('ka0s:studied', JSON.stringify(studied));
              updateProgress();
            });

            section.appendChild(el);
            topics.push({ it, secIdx, el, details, link });
          });

          els.notes.appendChild(section);
        });
        els.sectionCount.textContent = `${SECTIONS.length} semanas`;
        els.noteCount.textContent = `${total} días`;
      }

      function updateProgress() {
        let totalNotes = 0;
        let studiedTotal = 0;
        topics.forEach(({ it, el, link }) => {
          const checked = !!studied[it.id];
          el.classList.toggle('is-read', checked);
          link.classList.toggle('read', checked);
          if (el.hidden) return;
          totalNotes += 1;
          if (checked) studiedTotal += 1;
        });
        const percent = totalNotes > 0 ? Math.round((studiedTotal / totalNotes) * 100) : 0;
        els.studiedCount.textContent = `${percent}%`;
        els.countWrap.classList.toggle('done', percent === 100);
      }

      function applyFilter() {
        const searchTerm = els.search.value.trim().toLowerCase();
        const visibleBySection = SECTIONS.map(() => 0);
        topics.forEach(t => {
          const match = !searchTerm || t.it.t.toLowerCase().includes(searchTerm) || (t.it.d && t.it.d.toLowerCase().includes(searchTerm));
          t.el.hidden = !match;
          t.link.hidden = !match;
          if (match) visibleBySection[t.secIdx] += 1;
        });
        sectionEls.forEach(({ section, link }, i) => {
          section.hidden = visibleBySection[i] === 0;
          link.hidden = visibleBySection[i] === 0;
        });
        els.noMatch.hidden = visibleBySection.some(n => n > 0);
        updateProgress();
      }

      function setAll(open) {
        topics.forEach(t => { if (!t.el.hidden) t.details.open = open; });
      }

      function init() {
        build();
        applyFilter();
        els.search.addEventListener('input', applyFilter);

        els.expandAll.addEventListener('click', () => setAll(true));
        els.collapseAll.addEventListener('click', () => setAll(false));

        // Abrir el tema si se llega con un ancla
        const target = location.hash && document.getElementById(location.hash.slice(1));
        if (target && target.classList.contains('topic')) target.querySelector('details').open = true;

        document.getElementById('themeToggle').addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme:dark', isDark ? '1' : '0');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
          if(confirm('¿Cerrar sesión de Ka0s Training?')) {
            sessionStorage.removeItem('ka0s_auth');
            window.location.href = 'loginKa0s.html';
          }
        });
      }

      init();
    </script>
