<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ka0s Training</title>
    <script src="../theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/site.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
        .gate { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
        .login { width: 100%; max-width: 360px; }
        .login .wordmark { margin-bottom: 40px; }
        .login h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
        .login .lede { margin: 0 0 28px; font-size: 14.5px; color: var(--muted); }
        .login form { display: flex; flex-direction: column; gap: 16px; }
        .login label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 500; }
        .login .error { margin: 0; padding: 8px 12px; font-size: 13.5px; color: var(--bad); background: var(--bad-bg); border: 1px solid var(--bad-line); border-radius: 6px; }
        .login .btn { width: 100%; margin-top: 4px; }
        .login .btn.is-ok { background: var(--ok); border-color: var(--ok); color: var(--ink-text); }
        .login .back { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13.5px; }
        .login.shake { animation: shake .2s linear; }
        @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    </style>
</head>
<body>

    <main class="gate">
        <div class="login">
            <a href="../index.html" class="wordmark"><img src="../favicon.svg" alt="">CertHub</a>
            <h1>Ka0s Training</h1>
            <p class="lede">Área restringida para formación operativa</p>

            <form id="loginForm">
                <div>
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required class="field" autocomplete="username"
                        placeholder="Ingresa tu usuario">
                </div>

                <div>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required class="field" autocomplete="current-password"
                        placeholder="••••••••">
                </div>

                <p id="errorMessage" class="error hidden" role="alert">
                    Credenciales incorrectas
                </p>

                <button type="submit" class="btn btn-primary btn-lg">
                    Acceder al Plan de Estudio
                </button>
            </form>

            <div class="back">
                <a href="../index.html" class="link">← Volver al inicio</a>
            </div>
        </div>
    </main>

    <script>
        // Credenciales hardcodeadas (Simulación de .env para sitio estático)
        const VALID_USER = "b2bmasorange";
        const VALID_PASS = "ka0straining2026";

        // Comprobar si ya está logueado
        if (sessionStorage.getItem('ka0s_auth') === 'true') {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectTarget = urlParams.get('redirect') || 'apuntesKa0s.html';
            window.location.href = redirectTarget;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            if (user === VALID_USER && pass === VALID_PASS) {
                // Login correcto
                sessionStorage.setItem('ka0s_auth', 'true');
                // Efecto visual de éxito
                errorMsg.classList.add('hidden');
                const btn = this.querySelector('button');
                btn.textContent = 'Accediendo...';
                btn.classList.add('is-ok');

                // Redirect logic
                const urlParams = new URLSearchParams(window.location.search);
                const redirectTarget = urlParams.get('redirect') || 'apuntesKa0s.html';

                setTimeout(() => {
                    window.location.href = redirectTarget;
                }, 500);
            } else {
                // Error
                errorMsg.classList.remove('hidden');
                // Vibración simple
                const card = document.querySelector('.login');
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 200);
            }
        });
    </script>
</body>
</html>
