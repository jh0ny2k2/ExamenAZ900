<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuestionario · CertHub</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script src="../theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="../css/quiz.css">
</head>
<body>

    <header class="site-header sticky">
        <div class="wrap">
            <div class="crumbs">
                <a href="../index.html" class="wordmark"><img src="../favicon.svg" alt="">CertHub</a>
                <span class="sep">/</span>
                <span class="here" id="examTitle"></span>
            </div>
            <nav class="header-nav">
                <span id="scoreContainer" class="mono hide-sm hidden" style="font-size:12.5px"><span data-t="accuracy"></span> <span id="accuracy">0%</span></span>
                <span id="timer" class="mono hidden" style="font-size:12.5px"><span id="timeDisplay">00:00</span></span>
                <button id="modeSwitch"></button>
                <button id="themeToggle" class="theme-toggle" aria-label="Tema">
                    <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
            </nav>
        </div>
    </header>
    <div class="meter quiz-meter"><span id="progressBar"></span></div>

    <main class="quiz">

        <section id="card">
            <div class="quiz-status">
                <span><span data-t="question"></span> <strong id="current">1</strong> / <span id="total">–</span></span>
                <span id="examSubtitle"></span>
            </div>

            <h1 id="question" class="question"></h1>
            <div id="options" class="options"></div>
            <div id="feedback" class="hidden"></div>

            <div class="quiz-actions">
                <button id="resetBtn" class="link" data-t="restart"></button>
                <div class="right">
                    <span class="kbd-hint"><kbd>A</kbd>–<kbd>D</kbd> <kbd>↵</kbd></span>
                    <button id="checkBtn" class="btn btn-primary btn-lg hidden" data-t="check"></button>
                    <button id="nextBtn" class="btn btn-primary btn-lg hidden" data-t="next"></button>
                </div>
            </div>
        </section>

        <section id="final" class="result hidden">
            <p class="result-label" data-t="result"></p>
            <p id="finalScore" class="result-score">0%</p>
            <p id="finalLine" class="result-line"></p>
            <p id="finalVerdict" class="result-verdict"></p>
            <span id="finalTotal" class="hidden"></span>
            <div class="result-actions">
                <button id="reviewBtn" class="btn btn-lg" data-t="review"></button>
                <button id="restartBtn" class="btn btn-primary btn-lg" data-t="retry"></button>
                <a href="../index.html" class="btn btn-lg" data-t="home"></a>
            </div>
        </section>

    </main>

    <script>
        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme:dark', isDark ? '1' : '0');
        });
    </script>
    <script type="module" src="../app.js"></script>
</body>
</html>
