<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/premium.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateX(4px);
            background-color: rgba(14, 165, 233, 0.05);
        }
        
        /* Correct/Incorrect States */
        .state-correct {
            background-color: #f0fdf4 !important; /* green-50 */
            border-color: #22c55e !important; /* green-500 */
            color: #15803d !important; /* green-700 */
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.1);
        }
        .dark .state-correct {
            background-color: rgba(34, 197, 94, 0.1) !important;
            border-color: #22c55e !important;
            color: #4ade80 !important; /* green-400 */
        }

        .state-incorrect {
            background-color: #fef2f2 !important; /* red-50 */
            border-color: #ef4444 !important; /* red-500 */
            color: #b91c1c !important; /* red-700 */
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }
        .dark .state-incorrect {
            background-color: rgba(239, 68, 68, 0.1) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important; /* red-400 */
        }

        .state-selected {
            background-color: #f0f9ff !important; /* sky-50 */
            border-color: #0ea5e9 !important; /* sky-500 */
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        .dark .state-selected {
            background-color: rgba(14, 165, 233, 0.1) !important;
            border-color: #0ea5e9 !important;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-dark-bg dark:text-slate-100 transition-colors duration-200 flex flex-col">

    <!-- Navbar -->
    <nav class="premium-glass h-16 flex-shrink-0 z-50 sticky top-0">
        <div class="max-w-5xl mx-auto px-4 h-full flex items-center justify-between">
            <div class="flex items-center gap-5">
                <a href="../index.html" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 shadow-sm border border-slate-200 dark:border-slate-700 transition-all active:scale-90">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="h-8 w-px bg-slate-200 dark:bg-slate-700"></div>
                <div>
                    <h1 id="examTitle" class="font-heading font-bold text-sm md:text-lg leading-tight text-slate-900 dark:text-white">Loading...</h1>
                    <p id="examSubtitle" class="text-[10px] font-bold tracking-widest uppercase text-slate-400 dark:text-slate-500">Certification Prep</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div id="scoreContainer" class="hidden md:flex items-center gap-2.5 px-4 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 shadow-sm">
                    <i class="fa-solid fa-bullseye text-brand-500"></i>
                    <span id="accuracy">0%</span>
                </div>
                <button id="modeSwitch" class="text-xs font-bold px-5 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:opacity-90 transition-all shadow-md shadow-slate-900/10 active:scale-95">
                    Exam Mode
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8 md:py-16 flex flex-col animate-reveal">
        
        <!-- Progress -->
        <div class="mb-8 md:mb-12">
            <div class="flex justify-between text-[10px] font-bold tracking-[0.2em] uppercase text-slate-400 mb-4">
                <span>Question <span id="current" class="text-slate-900 dark:text-white text-sm">1</span> <span class="mx-2 opacity-30">/</span> <span id="total" class="opacity-60">--</span></span>
                <span id="progressPercent" class="text-brand-500">0%</span>
            </div>
            <div class="h-1.5 w-full bg-slate-200 dark:bg-slate-800/30 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gradient-to-r from-brand-500 via-indigo-500 to-brand-500 bg-[length:200%_100%] animate-shimmer rounded-full transition-all duration-1000 ease-out shadow-[0_0_20px_rgba(14,165,233,0.3)]" style="width: 0%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div id="card" class="premium-card rounded-3xl md:rounded-[3rem] p-6 md:p-16 flex-1 flex flex-col relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-64 h-64 bg-brand-500/5 rounded-full -mr-32 -mt-32 blur-[100px] group-hover:bg-brand-500/10 transition-colors duration-1000"></div>
            
            <div class="flex-1 relative z-10">
                <div class="mb-8 md:mb-12">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase bg-slate-100 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700/50 mb-4 md:mb-6">
                        <i class="fa-solid fa-layer-group text-brand-500"></i> Knowledge Check
                    </div>
                    <h2 id="question" class="text-2xl md:text-4xl font-heading font-extrabold text-slate-900 dark:text-white leading-[1.2] tracking-tight">
                        Initializing question bank...
                    </h2>
                </div>

                <div id="options" class="grid grid-cols-1 gap-3 md:gap-4">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Feedback -->
            <div id="feedback" class="mt-8 md:mt-12 hidden animate-reveal">
                <!-- Feedback content -->
            </div>

            <!-- Footer Actions -->
            <div class="mt-10 md:mt-16 pt-8 md:pt-10 border-t border-slate-100 dark:border-slate-800/50 flex flex-col md:flex-row justify-between items-center gap-6 md:gap-8 relative z-10">
                <button id="resetBtn" class="text-[10px] font-bold tracking-[0.2em] uppercase text-slate-400 hover:text-red-500 transition-all flex items-center gap-3 active:scale-95 order-2 md:order-1">
                    <i class="fa-solid fa-rotate-right"></i> Restart Session
                </button>
                
                <div class="flex gap-4 w-full md:w-auto order-1 md:order-2">
                    <button id="checkBtn" class="hidden flex-1 md:flex-none px-6 md:px-10 py-4 md:py-5 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-bold shadow-2xl shadow-slate-900/20 transition-all active:scale-95 justify-center premium-btn">
                        Check Answer
                    </button>
                    <button id="nextBtn" class="hidden flex-1 md:flex-none px-6 md:px-10 py-4 md:py-5 rounded-2xl bg-brand-600 text-white font-bold shadow-2xl shadow-brand-500/30 transition-all active:scale-95 flex items-center justify-center gap-4 premium-btn">
                        Next Question <i class="fa-solid fa-chevron-right text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Final Screen -->
        <div id="final" class="hidden flex-1 flex flex-col items-center justify-center premium-card rounded-3xl md:rounded-[4rem] p-8 md:p-24 text-center relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-brand-500/5 via-transparent to-transparent"></div>
            
            <div class="relative z-10 w-full max-w-2xl">
                <div class="w-24 h-24 md:w-32 md:h-32 rounded-2xl md:rounded-[2.5rem] bg-gradient-to-br from-yellow-300 via-orange-500 to-red-600 flex items-center justify-center mx-auto mb-8 md:mb-10 text-white text-4xl md:text-6xl shadow-[0_20px_50px_rgba(249,115,22,0.3)] rotate-3 hover:rotate-0 transition-transform duration-500">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                
                <h2 class="text-4xl md:text-6xl font-heading font-extrabold mb-4 text-slate-900 dark:text-white tracking-tighter">Session Complete!</h2>
                <p class="text-slate-500 dark:text-slate-400 mb-10 md:mb-16 text-lg md:text-xl font-light">Outstanding effort. Here's your performance breakdown.</p>
                
                <div class="grid grid-cols-2 gap-4 md:gap-8 mb-10 md:mb-16 w-full">
                    <div class="text-center p-6 md:p-10 rounded-2xl md:rounded-[2.5rem] bg-white/50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="text-[10px] font-bold tracking-[0.2em] uppercase text-slate-400 mb-2 md:mb-4">Accuracy</div>
                        <div id="finalScore" class="text-3xl md:text-5xl font-heading font-bold text-slate-900 dark:text-white">0%</div>
                    </div>
                    <div class="text-center p-6 md:p-10 rounded-2xl md:rounded-[2.5rem] bg-white/50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="text-[10px] font-bold tracking-[0.2em] uppercase text-slate-400 mb-2 md:mb-4">Questions</div>
                        <div id="finalTotal" class="text-3xl md:text-5xl font-heading font-bold text-slate-900 dark:text-white">0</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 md:gap-6 justify-center">
                    <a href="../index.html" class="px-8 md:px-10 py-4 md:py-5 rounded-2xl border border-slate-200 dark:border-slate-700 font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all flex items-center justify-center gap-3 active:scale-95">
                        <i class="fa-solid fa-house text-sm"></i> Dashboard
                    </a>
                    <button id="restartBtn" class="px-10 md:px-12 py-4 md:py-5 rounded-2xl bg-brand-600 text-white font-bold hover:bg-brand-700 shadow-2xl shadow-brand-500/30 transition-all active:scale-95 flex items-center justify-center gap-3 premium-btn">
                        <i class="fa-solid fa-rotate-left text-sm"></i> Retake Quiz
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="../app.js"></script>
</body>
</html>
